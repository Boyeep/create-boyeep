name: Publish npm packages to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - next-bun-kit
          - nextjs-go-monorepo-kit
          - nextjs-go-realtime-kit
          - nextjs-python-ai-agent-kit
          - nextjs-python-ai-chatbot-kit
          - nextjs-python-computer-vision-kit
          - nextjs-python-rag-kit
          - nextjs-python-voice-assistant-kit
          - python-background-worker-kit
          - python-computer-vision-api-kit
          - python-document-intelligence-kit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@boyeep'

      - name: Publish package
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry https://npm.pkg.github.com --provenance
